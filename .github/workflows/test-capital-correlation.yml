name: TIDELINE K-line integrity checks
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'scripts/test-index-inline-syntax.mjs'
      - '.github/workflows/test-capital-correlation.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'scripts/test-index-inline-syntax.mjs'
      - '.github/workflows/test-capital-correlation.yml'
permissions:
  contents: read
jobs:
  kline-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate inline JavaScript and K-line history invariants
        run: node scripts/test-index-inline-syntax.mjs
      - name: Test candle-flow aggregate availability and partial failures
        run: node scripts/test-candle-flow.mjs
