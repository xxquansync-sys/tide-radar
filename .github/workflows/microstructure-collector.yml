name: Tide Radar microstructure collector
on:
  push:
    branches: [main]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
concurrency:
  group: tide-radar-microstructure-collector
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test market context mapping
        run: TIDE_MARKET_CONTEXT_TEST=1 node scripts/collect-market-context.mjs
      - name: Test capital behavior detector
        run: TIDE_DETECTOR_TEST=1 node scripts/detect-capital-behavior.mjs
      - name: Test cross-source capital correlation
        run: node scripts/test-capital-correlation.mjs
      - name: Collect OKX ETH and WLD trades and order books
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: node scripts/collect-microstructure.mjs
      - name: Collect OKX spot and derivatives market context
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: node scripts/collect-market-context.mjs
      - name: Detect capital behavior events and evaluate outcomes
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: node scripts/detect-capital-behavior.mjs
      - name: Correlate market, derivatives and confirmed wallet-flow evidence
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: node scripts/correlate-capital-behavior.mjs
