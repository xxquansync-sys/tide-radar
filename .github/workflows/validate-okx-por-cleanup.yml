name: Validate OKX PoR cleanup script
on:
  push:
    branches:
      - fix/okx-por-cleanup-no-exact-count
    paths:
      - 'scripts/cleanup-okx-por.mjs'
      - '.github/workflows/validate-okx-por-cleanup.yml'
      - '.github/workflows/cleanup-failed-okx-por.yml'
      - 'supabase/migrations/20261109051843_cleanup_okx_entity_account_batch_index.sql'
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate cleanup script syntax
        run: node --check scripts/cleanup-okx-por.mjs
      - name: Verify cleanup uses exact selected IDs
        run: grep -q 'id=in.(' scripts/cleanup-okx-por.mjs
