name: One-time cleanup of failed OKX PoR address import
on:
  push:
    branches: [main]
    paths:
      - 'scripts/cleanup-okx-por.mjs'
      - '.github/workflows/cleanup-failed-okx-por.yml'
permissions:
  contents: read
concurrency:
  group: tide-radar-okx-por-cleanup
  cancel-in-progress: false
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Remove only failed OKX PoR wallet rows in bounded batches
        env:
          SUPABASE_URL: https://gkgvvljxmrbwmqzgyykn.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: node scripts/cleanup-okx-por.mjs
